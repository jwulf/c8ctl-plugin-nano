name: CI

# Pull-request gate. This exists primarily so Renovate has a green branch status to wait on
# before it self-merges a non-major @nanobpm/* bump (see renovate.json). It mirrors the Lint &
# Test job in release.yml so a PR is validated with the same lint + test steps that gate a
# release on main — without it, Renovate's automerge would land dependency bumps with no CI.
on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
